<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAYA ROGUE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  /* 80〜90年代のレトロ PC 風の構成 (ドットフォント・枠線ウィンドウ) に、ファンタジー RPG の配色。
     古びた金の枠、羊皮紙色の文字、暗い石の地。色数は絞り、赤と緑は体力と危険にだけ使う。 */
  :root {
    --bg: #070605; --panel: #0d0b08; --frame: #6e562e; --frame-hi: #a88a4c; --sel: #2a1a15;
    --text: #cfc3a3; --dim: #7d7359; --faint: #3a3427; --track: #1a1610;
    --accent: #c4a150; --ok: #6c8c52; --warn: #b78636; --bad: #a23a32;
    --font: "DotGothic16", "MS Gothic", "ＭＳ ゴシック", monospace;
  }
  * { box-sizing: border-box; border-radius: 0 !important; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; padding-bottom: 80px; background: var(--bg); color: var(--text); font: 16px/1.4 var(--font);
         text-shadow: 0 0 4px rgba(200, 150, 80, .14); -webkit-font-smoothing: none; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .62) 100%); }

  header { display: flex; align-items: center; gap: 16px; padding: 3px 12px; background: #140e0a; color: var(--text); border-bottom: 2px solid var(--frame); }
  header h1 { font: 400 16px/1.4 var(--font); margin: 0; letter-spacing: .12em; }
  header h1 span { color: var(--accent); }
  header .ver { color: var(--frame-hi); }
  header .spacer { flex: 1; }
  #device { color: var(--frame-hi); }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 12px; padding: 12px; align-items: start; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }

  fieldset { border: 2px solid var(--frame); margin: 0; padding: 6px 10px 10px; min-width: 0; background: var(--panel);
             box-shadow: 4px 4px 0 #050403; }
  legend { padding: 0 10px; font-size: 18px; line-height: 1.5; letter-spacing: .1em; color: #120c06; background: var(--frame-hi); text-shadow: none; }
  legend em { font-style: normal; font-size: 20px; letter-spacing: .06em; background: var(--panel); color: #e8d9a8; padding: 0 10px; margin-left: 10px; border: 1px solid var(--frame); text-shadow: 0 0 4px rgba(200, 150, 80, .25); }

  .stage { position: relative; padding: 4px; }
  canvas { display: block; width: 100%; image-rendering: pixelated; }
  #died { position: absolute; inset: 4px; display: grid; place-items: center; pointer-events: none; visibility: hidden; background: rgba(40, 6, 4, .6); }
  #died.show { visibility: visible; }
  #died div { text-align: center; font: 400 72px/1.1 var(--font); letter-spacing: .1em; color: var(--bad); text-shadow: 4px 4px 0 #2a0806; }
  #died.show div { animation: blink 0.8s steps(1) infinite; }
  #died.won { background: rgba(30, 24, 6, .6); }
  #died.won div { color: var(--accent); text-shadow: 4px 4px 0 #2a2006; animation: none; }
  #died small { display: block; font: 16px/1.6 var(--font); letter-spacing: 0; color: var(--text); text-shadow: 2px 2px 0 #000; margin-top: 12px; animation: none; }
  @keyframes blink { 50% { color: #7a2620; } }

  aside { display: grid; gap: 12px; }
  .bar { height: 14px; --c: var(--ok); background: repeating-linear-gradient(90deg, var(--track) 0 7px, transparent 7px 9px); margin: 4px 0 8px; }
  .bar i { display: block; height: 100%; width: 100%; background: repeating-linear-gradient(90deg, var(--c) 0 7px, transparent 7px 9px); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 10px; }
  .cell { display: flex; flex-direction: column-reverse; padding: 2px 0; border-top: 1px dotted var(--faint); }
  .cell .v { color: var(--accent); font-size: 20px; line-height: 1.2; }
  .cell .v.small { font-size: 13px; line-height: 1.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .k { color: var(--dim); font-size: 14px; }

  #state { color: #a3987a; min-height: 46px; margin-bottom: 6px; }
  #state::before { content: "A>"; color: var(--dim); margin-right: 6px; }
  .act { display: grid; grid-template-columns: 16px 58px 1fr 44px; gap: 6px; align-items: center; padding: 1px 2px; }
  .act .mark { color: var(--accent); }
  .act .name { color: var(--frame-hi); }
  .act .track { height: 12px; background: repeating-linear-gradient(90deg, var(--track) 0 5px, transparent 5px 7px); }
  .act .fill { height: 100%; background: repeating-linear-gradient(90deg, var(--dim) 0 5px, transparent 5px 7px); }
  .act .pct { text-align: right; color: var(--dim); }
  .act.done { background: var(--sel); }
  .act.done .name, .act.done .pct { color: var(--accent); }
  .act.done .fill { background: repeating-linear-gradient(90deg, var(--accent) 0 5px, transparent 5px 7px); }
  #acts { min-height: 132px; }
  table { width: 100%; border-collapse: collapse; }
  th { font-weight: 400; color: var(--dim); font-size: 14px; text-align: right; border-bottom: 1px dotted var(--faint); }
  td { text-align: right; color: var(--accent); }
  th:first-child, td:first-child { text-align: left; color: var(--frame-hi); }
  tr.now td:first-child::before { content: "▶"; color: var(--accent); }
  tr.now { background: var(--sel); }
  #log { color: var(--dim); height: 136px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  #log div::before { content: "・"; }
  #log div:last-child { color: var(--text); }

  /* 画面下のファンクションキーバー */
  footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--panel); border-top: 2px solid var(--frame); }
  footer button { font: 16px/1.2 var(--font); background: var(--panel); color: var(--text); border: 0; padding: 2px 10px 2px 0; cursor: pointer; }
  footer button kbd { font: inherit; background: var(--frame); color: #140f08; padding: 1px 6px; margin-right: 8px; text-shadow: none; }
  footer button:hover { color: var(--frame-hi); }
  footer button.on { color: var(--accent); }
  footer button.on kbd { background: var(--accent); }
  footer .spacer { flex: 1; }
  footer { flex-wrap: wrap; }
  footer .gens, footer .orders { display: flex; align-items: center; gap: 4px; color: var(--frame-hi); margin-left: 12px; }
  footer .gens button { padding: 2px 8px; border: 1px solid var(--faint); }
  footer .gens button.on { border-color: var(--accent); }
  footer .orders button { padding: 2px 10px 2px 0; border: 1px solid var(--faint); }
  footer .orders button.on { border-color: var(--accent); background: var(--sel); }
  #order { color: var(--accent); font-size: 20px; margin-bottom: 4px; }
  #order::before { content: "命令:"; color: var(--dim); font-size: 16px; margin-right: 8px; }
  #adviser { margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px dotted var(--faint); }
  #adviser.off { display: none; }
  #plan { color: var(--accent); font-size: 18px; }
  #plan::before { content: "方針:"; color: var(--dim); font-size: 16px; margin-right: 8px; }
  #reason { color: var(--dim); font-size: 14px; min-height: 1.3em; }
  #adviser.thinking #reason { color: var(--warn); }
  footer .adviser button { padding: 2px 8px; border: 1px solid var(--faint); margin-left: 12px; }
  footer .adviser button.on { border-color: var(--accent); background: var(--sel); }
  footer label { display: flex; align-items: center; gap: 8px; color: var(--frame-hi); }
  footer label b { font-weight: 400; color: var(--accent); min-width: 84px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 180px; height: 14px; background: repeating-linear-gradient(90deg, var(--faint) 0 4px, transparent 4px 8px); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 20px; background: var(--accent); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 12px; height: 20px; background: var(--accent); border: 0; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>LAYA <span>ROGUE</span></h1><span class="ver">Ver 1.00</span>
  <div class="spacer"></div>
  <div id="device">接続中…</div>
</header>
<main>
  <fieldset class="stage">
    <legend>DUNGEON<em id="depth">B1F</em></legend>
    <canvas id="cv"></canvas>
    <div id="died"><div><span id="diedTitle">LAYA DIED</span><small id="diedSub"></small></div></div>
  </fieldset>
  <aside>
    <fieldset>
      <legend>勇者</legend>
      <div class="bar" id="hpbar"><i id="hp"></i></div>
      <div class="grid">
        <div class="cell"><div class="v" id="hpv">–</div><div class="k">HP</div></div>
        <div class="cell"><div class="v" id="lv">1</div><div class="k">レベル</div></div>
        <div class="cell"><div class="v" id="str">16</div><div class="k">力</div></div>
        <div class="cell"><div class="v" id="ac">6</div><div class="k" title="小さいほど硬い">防御</div></div>
        <div class="cell"><div class="v" id="hunger">–</div><div class="k">満腹</div></div>
        <div class="cell"><div class="v" id="food">1</div><div class="k">食料</div></div>
        <div class="cell"><div class="v" id="pot">0</div><div class="k">回復薬</div></div>
        <div class="cell"><div class="v" id="gold">0</div><div class="k">金貨</div></div>
        <div class="cell"><div class="v" id="kills">0</div><div class="k">撃破</div></div>
        <div class="cell"><div class="v" id="turn">0</div><div class="k">ターン</div></div>
        <div class="cell"><div class="v" id="score">0</div><div class="k">SCORE</div></div>
        <div class="cell"><div class="v" id="hiscore">0</div><div class="k">HI-SCORE</div></div>
        <div class="cell"><div class="v small" id="weapon">–</div><div class="k">武器</div></div>
        <div class="cell"><div class="v small" id="armor">–</div><div class="k">防具</div></div>
        <div class="cell"><div class="v" id="missiles">0</div><div class="k">飛び道具</div></div>
        <div class="cell"><div class="v" id="scrolls">0</div><div class="k">巻物</div></div>
        <div class="cell"><div class="v" id="unkp">0</div><div class="k">未識別の薬</div></div>
        <div class="cell"><div class="v" id="unks">0</div><div class="k">未識別の巻物</div></div>
        <div class="cell"><div class="v" id="wands">0</div><div class="k">杖 (残り回数)</div></div>
        <div class="cell"><div class="v" id="unkw">0</div><div class="k">未識別の杖</div></div>
      </div>
    </fieldset>
    <fieldset>
      <legend>LAYA の判断<em id="ms">– ms</em></legend>
      <div id="order">–</div>
      <div id="adviser" class="off"><div id="plan">–</div><div id="reason"></div></div>
      <div id="state"></div>
      <div id="acts"></div>
      <div class="grid">
        <div class="cell"><div class="v" id="rate">0</div><div class="k">手/秒</div></div>
        <div class="cell"><div class="v" id="genNow">–</div><div class="k">学習世代</div></div>
        <div class="cell"><div class="v">なし</div><div class="k">手の指示</div></div>
        <div class="cell"><div class="v">0</div><div class="k">生成token</div></div>
      </div>
    </fieldset>
    <fieldset>
      <legend>世代別の成績</legend>
      <table><thead><tr><th>世代</th><th>挑戦</th><th>平均到達</th><th>最深</th><th>平均撃破</th></tr></thead><tbody id="genStats"></tbody></table>
    </fieldset>
    <fieldset><legend>ログ</legend><div id="log"></div></fieldset>
  </aside>
</main>
<footer>
  <button id="pause"><kbd>SPACE</kbd><span>一時停止</span></button>
  <button id="step"><kbd>.</kbd>1手進める</button>
  <button id="restart"><kbd>R</kbd>最初から</button>
  <div class="orders">命令 <span id="orders"></span></div>
  <div class="gens">世代 <span id="gens"></span></div>
  <div class="adviser"><button id="adviserBtn"><kbd>L</kbd><span>方針役</span></button></div>
  <div class="spacer"></div>
  <label>SPEED <input type="range" id="speed" min="0" max="100" value="62"> <b id="speedv"></b></label>
</footer>

<script>
const $ = id => document.getElementById(id);
const JP = { attack: "攻撃", throw: "投擲", approach: "接近", flee: "逃走", quaff_heal: "回復薬", quaff_str: "力の薬",
             read_map: "地図の巻物", read_teleport: "転移の巻物", quaff_unknown: "未識別の薬", read_unknown: "未識別の巻物",
             read_identify: "識別の巻物", zap_attack: "攻撃の杖", zap_slow: "鈍足の杖", zap_away: "追放の杖", zap_unknown: "未識別の杖",
             eat: "食事", pick_up: "回収",
             equip: "装備", explore: "探索", search: "捜索", descend: "階段へ", rest: "待機" };
const HUNGER_JP = { fine: "十分", hungry: "空腹", weak: "衰弱", fainting: "飢餓" };
const WEAPON_JP = { mace: "メイス", "long sword": "長剣", "two handed sword": "両手剣", spear: "槍", dagger: "短剣" };
const ARMOR_JP = { "leather armor": "革鎧", "ring mail": "鎖帷子", "studded leather armor": "鋲革鎧", "scale mail": "鱗鎧",
                   "chain mail": "鎖鎧", "splint mail": "板金鎖鎧", "banded mail": "帯金鎧", "plate mail": "板金鎧" };
const ORDER = Object.keys(JP);
const ORDER_JP = { cautious: "慎重に", aggressive: "攻めろ", loot: "漁れ", descend: "降りろ" };
const scoreOf = h => h.depth * 100 + h.level * 20 + h.gold;
let order = null, hiscore = 0;
try { hiscore = +localStorage.getItem("laya-rogue-hiscore") || 0; } catch {}
const ITEM = { gold: ["*", "#e2c25c"], food: [":", "#c9a87a"], potion: ["!", "#b184c4"], weapon: [")", "#a9b4bd"], armor: ["]", "#a9b4bd"],
               scroll: ["?", "#d9d4a8"], missile: [")", "#a9b4bd"], bow: [")", "#a9b4bd"] };
const monsterColor = mo => mo.awake ? "#c85a44" : "#8d8a72";   // 眠っている相手はくすんだ色、襲ってくる相手は赤
const VIEW_W = 50;                                                // 横 80 マスのうち、勇者を中心にこの幅だけ映す
let camX = 0;
const FONT = '"DotGothic16", "MS Gothic", monospace';

let GW = 48, GH = 26, T = 20;
let tiles = [], lit = new Set(), hero = null, heroDraw = null, monsters = new Map(), items = [], traps = [], floats = [], danger = 0, shake = 0, flash = 0;
const stats = { stamps: [], ms: [] };
const genStats = new Map();   // 世代名 -> { runs, depth, best, kills }
let generation = null;
const genLabel = g => g ?? "未学習";

// ---------------------------------------------------------------- websocket
const ws = new WebSocket(`ws://${location.host}/ws`);
const send = o => ws.readyState === 1 && ws.send(JSON.stringify(o));
ws.onclose = () => { $("device").textContent = "切断されました（server.py を再起動してください）"; };
ws.onmessage = ev => {
  const m = JSON.parse(ev.data);
  if (m.type === "hello") { GW = m.w; GH = m.h; $("device").textContent = ""; resize(); pushConfig(); setupGenerations(m.generations, m.generation); setupOrders(m.orders, m.order); setAdviser(m.adviser); }
  else if (m.type === "adviser") setAdviser(m.adviser);
  else if (m.type === "thinking") { $("adviser").classList.add("thinking"); $("reason").textContent = `方針役が考え中… (${TRIGGER_JP[m.kind] ?? m.kind})`; }
  else if (m.type === "advice") onAdvice(m);
  else if (m.type === "order") setOrder(m.order, true);
  else if (m.type === "generation") setGeneration(m.generation);
  else if (m.type === "floor") { tiles = Array.from({ length: GH }, () => new Array(GW).fill(-1)); monsters.clear(); hero = null; heroDraw = null; $("died").classList.remove("show"); }
  else if (m.type === "frame") onFrame(m);
  else if (m.type === "end") {
    shake = m.won ? 0 : 1;
    const gs = genStats.get(genLabel(m.generation)) ?? { runs: 0, depth: 0, best: 0, kills: 0 };
    gs.runs++; gs.depth += m.depth; gs.kills += m.kills; gs.best = Math.max(gs.best, m.depth);
    genStats.set(genLabel(m.generation), gs); renderGenStats();
    $("diedTitle").textContent = m.won ? "B20F 到達！" : "LAYA DIED";
    $("diedSub").textContent = (m.won ? "" : `死因: ${m.cause} / `) + `B${m.depth}F / Lv${m.level} / 撃破 ${m.kills} / 金貨 ${m.gold} / ${m.turn} ターン`;
    $("died").classList.toggle("won", m.won);
    $("died").classList.add("show");
  }
};

// ---------------------------------------------------------------- controls
let paused = false;
const TRIGGER_JP = { floor: "階に到着", hp: "体力低下", hunger: "空腹", danger: "強敵", stuck: "足踏み", periodic: "見回り" };
const PLAN_JP = { explore_fully: "この階を探索し切る", descend_asap: "階段を見つけ次第降りる", free: "おまかせ" };
const TACTIC_JP = { fight: "戦え", flee: "逃げろ", escape: "階段で離脱" };
let adviser = null;
function planText(a) {
  return [PLAN_JP[a.plan] ?? a.plan, a.rest ? "傷は休んで治す" : null, TACTIC_JP[a.tactic] ? `敵には「${TACTIC_JP[a.tactic]}」` : null].filter(Boolean).join(" / ");
}
function setAdviser(a) {
  adviser = a;
  $("adviser").classList.toggle("off", !a.enabled);
  $("adviserBtn").classList.toggle("on", a.enabled && !a.stopped);
  $("adviserBtn").querySelector("span").textContent = `方針役 ${a.stopped ? "停止中" : a.enabled ? "ON" : "OFF"}` + (a.enabled ? ` (${a.model} ${a.calls}回)` : "");
  $("plan").textContent = planText(a);
  if (a.stopped) $("reason").textContent = `自動停止: ${a.stopped}（L で再開）`;
}
function onAdvice(m) {
  $("adviser").classList.remove("thinking");
  setAdviser(m.adviser);
  const el = document.createElement("div");
  if (m.error) { $("reason").textContent = `方針役の応答なし: ${m.error}`; el.textContent = "方針役の応答なし"; }
  else {
    $("reason").textContent = `${TRIGGER_JP[m.kind] ?? m.kind}: ${m.reason} (${m.sec}秒)`;
    el.textContent = `方針役「${m.reason}」`;
    if (hero) floats.push({ x: hero.x, y: hero.y - 1, text: `「${PLAN_JP[m.plan] ?? m.plan}」`, c: "#ecd07a", life: 1.4, vy: -0.7 });
  }
  el.style.color = "var(--accent)";
  $("log").appendChild(el);
  while ($("log").children.length > 6) $("log").firstChild.remove();
}
function setupOrders(list, current) {
  $("order").style.display = document.querySelector("footer .orders").style.display = list.length ? "" : "none";
  $("orders").innerHTML = "";
  list.forEach((name, i) => {
    const b = document.createElement("button");
    b.innerHTML = `<kbd>${i + 1}</kbd>${ORDER_JP[name] ?? name}`; b.dataset.order = name;
    b.onclick = () => send({ type: "order", name });
    $("orders").appendChild(b);
  });
  setOrder(current, false);
}
function setOrder(name, shout) {
  order = name;
  for (const b of $("orders").children) b.classList.toggle("on", b.dataset.order === name);
  $("order").textContent = ORDER_JP[name] ?? name;
  if (shout && hero) floats.push({ x: hero.x, y: hero.y - 1, text: `「${ORDER_JP[name]}！」`, c: "#ecd07a", life: 1.1, vy: -0.9 });
}
function setupGenerations(list, current) {
  $("gens").innerHTML = "";
  for (const name of [null, ...list]) {
    const b = document.createElement("button");
    b.textContent = genLabel(name); b.dataset.gen = name ?? "";
    b.onclick = () => send({ type: "generation", name });
    $("gens").appendChild(b);
  }
  setGeneration(current);
}
function setGeneration(name) {
  generation = name;
  for (const b of $("gens").children) b.classList.toggle("on", b.dataset.gen === (name ?? ""));
  $("genNow").textContent = genLabel(name);
  renderGenStats();
}
function renderGenStats() {
  const names = [...$("gens").children].map(b => genLabel(b.dataset.gen || null));
  $("genStats").innerHTML = names.map(n => {
    const s = genStats.get(n);
    return `<tr class="${n === genLabel(generation) ? "now" : ""}"><td>${n}</td><td>${s ? s.runs : "–"}</td><td>${s ? "B" + (s.depth / s.runs).toFixed(1) + "F" : "–"}</td><td>${s ? "B" + s.best + "F" : "–"}</td><td>${s ? (s.kills / s.runs).toFixed(1) : "–"}</td></tr>`;
  }).join("");
}
function delayFromSlider() { const v = +$("speed").value; return v >= 100 ? 0 : Math.pow(1 - v / 100, 2.2) * 1.0; }
function pushConfig() {
  const d = delayFromSlider();
  $("speedv").textContent = d === 0 ? "MAX" : `${(1 / (d + 0.02)).toFixed(d > 0.2 ? 1 : 0)} 手/秒`;
  send({ type: "config", delay: d, paused });
}
$("speed").oninput = pushConfig;
$("pause").onclick = () => { paused = !paused; $("pause").classList.toggle("on", paused); $("pause").querySelector("span").textContent = paused ? "再開" : "一時停止"; pushConfig(); };
$("step").onclick = () => { if (!paused) $("pause").onclick(); send({ type: "step" }); };
$("restart").onclick = () => send({ type: "restart" });
$("adviserBtn").onclick = () => send({ type: "adviser", enabled: !(adviser?.enabled && !adviser?.stopped) });
addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); $("pause").onclick(); }
  else if (e.key === ".") $("step").onclick();
  else if (e.key === "r" || e.key === "R") $("restart").onclick();
  else if (e.key === "l" || e.key === "L") $("adviserBtn").onclick();
  else if ("1234".includes(e.key)) $("orders").children[+e.key - 1]?.click();
});

// ---------------------------------------------------------------- frame
let pendingPanel = null;
function onFrame(m) {
  if (m.adviser) setAdviser(m.adviser);
  for (const [x, y, t] of m.seen) tiles[y][x] = t;
  lit = new Set(m.visible.map(([x, y]) => y * GW + x));
  items = m.items; traps = m.traps ?? [];

  if (hero && m.hero.hp < hero.hp) { floats.push({ x: m.hero.x, y: m.hero.y, text: "-" + (hero.hp - m.hero.hp), c: "#d8563f", life: 0.7 }); flash = 1; }
  if (hero && m.hero.hp > hero.hp + 2) floats.push({ x: m.hero.x, y: m.hero.y, text: "+" + (m.hero.hp - hero.hp), c: "#8fbf6a", life: 0.8 });
  const seenIds = new Set();
  for (const mo of m.monsters) {
    seenIds.add(mo.id);
    const old = monsters.get(mo.id);
    if (old && mo.hp < old.hp) floats.push({ x: mo.x, y: mo.y, text: "-" + (old.hp - mo.hp), c: "#ecd07a", life: 0.6 });
    monsters.set(mo.id, { ...mo, dx: old ? old.dx : mo.x, dy: old ? old.dy : mo.y });
  }
  for (const [id, old] of monsters) if (!seenIds.has(id)) {
    if (Math.max(Math.abs(old.x - m.hero.x), Math.abs(old.y - m.hero.y)) <= 1 && m.decision.action === "attack")
      for (let k = 0; k < 10; k++) floats.push({ x: old.x, y: old.y, vx: (Math.random() - .5) * 5, vy: (Math.random() - .5) * 5, text: "·", c: "#c85a44", life: 0.45 });
    monsters.delete(id);
  }
  hero = m.hero;
  if (!heroDraw) heroDraw = { x: hero.x, y: hero.y };
  danger += (Math.max(0, 1 - 2 * hero.hp / hero.max_hp) - danger) * 0.35;   // HP が半分を切ると画面の縁が赤くなる

  const d = m.decision, now = performance.now();
  stats.stamps.push(now); if (d.ms) { stats.ms.push(d.ms); if (stats.ms.length > 120) stats.ms.shift(); }
  for (const line of m.log) { const el = document.createElement("div"); el.textContent = line; $("log").appendChild(el); }
  while ($("log").children.length > 6) $("log").firstChild.remove();
  pendingPanel = m;
}

setInterval(() => {                       // パネルは 10Hz。毎フレーム書き換えると読めない
  const now = performance.now();
  stats.stamps = stats.stamps.filter(s => now - s < 1000);
  $("rate").textContent = stats.stamps.length;
  if (stats.ms.length) { const s = [...stats.ms].sort((a, b) => a - b); $("ms").textContent = `${s[s.length >> 1].toFixed(1)} ms`; }
  const m = pendingPanel; if (!m) return; pendingPanel = null;
  const h = m.hero, f = h.hp / h.max_hp;
  $("depth").textContent = `B${h.depth}F`;
  $("hp").style.width = f * 100 + "%"; $("hpbar").style.setProperty("--c", f <= .25 ? "var(--bad)" : f <= .5 ? "var(--warn)" : "var(--ok)");
  $("hpv").textContent = `${h.hp}/${h.max_hp}`; $("lv").textContent = h.level; $("pot").textContent = h.heal;
  $("str").textContent = h.str < h.max_str ? `${h.str}/${h.max_str}` : h.str; $("ac").textContent = h.ac;
  $("hunger").textContent = HUNGER_JP[h.hunger] ?? h.hunger; $("food").textContent = h.food;
  $("hunger").style.color = h.hunger === "fine" ? "" : "var(--bad)";
  $("gold").textContent = h.gold; $("kills").textContent = h.kills; $("turn").textContent = m.turn;
  $("weapon").textContent = WEAPON_JP[h.weapon] ?? h.weapon; $("armor").textContent = ARMOR_JP[h.armor] ?? h.armor;
  $("missiles").textContent = h.missiles + (h.bow ? "" : " (弓なし)"); $("scrolls").textContent = h.scrolls;
  $("unkp").textContent = h.unknown_potions ?? 0; $("unks").textContent = h.unknown_scrolls ?? 0;
  $("wands").textContent = h.wands ?? 0; $("unkw").textContent = h.unknown_wands ?? 0;
  const sc = scoreOf(h);
  if (sc > hiscore) { hiscore = sc; try { localStorage.setItem("laya-rogue-hiscore", hiscore); } catch {} }
  $("score").textContent = sc; $("hiscore").textContent = hiscore;
  const d = m.decision;
  $("state").textContent = d.state;
  const acts = ORDER.filter(a => a in d.probs);
  $("acts").innerHTML = acts.map(a =>
    `<div class="act ${a === d.action ? "done" : ""}"><span class="mark">${a === d.action ? "▶" : ""}</span><span class="name">${JP[a]}</span>`
    + `<div class="track"><div class="fill" style="width:${(d.probs[a] * 100).toFixed(1)}%"></div></div><span class="pct">${Math.round(d.probs[a] * 100)}%</span></div>`
  ).join("");
}, 100);

// ---------------------------------------------------------------- canvas
const cv = $("cv"), g = cv.getContext("2d");
function resize() {
  const w = cv.parentElement.clientWidth - 8, dpr = devicePixelRatio || 1;
  T = Math.floor(w / VIEW_W);
  cv.style.height = T * GH + "px";
  cv.width = w * dpr; cv.height = T * GH * dpr;
  g.setTransform(dpr, 0, 0, dpr, (w - T * VIEW_W) / 2 * dpr, 0);
}
addEventListener("resize", resize);
document.fonts?.ready.then(resize);

let prev = performance.now();
function draw(now) {
  const dt = Math.min(.05, (now - prev) / 1000); prev = now;
  g.save();
  g.fillStyle = "#000"; g.fillRect(-T, 0, T * (VIEW_W + 2), T * GH);
  if (heroDraw) camX += (Math.max(0, Math.min(GW - VIEW_W, heroDraw.x - VIEW_W / 2)) - camX) * Math.min(1, dt * 6);
  g.translate(-camX * T, 0);
  if (shake > 0) { shake = Math.max(0, shake - dt * 2); g.translate((Math.random() - .5) * 14 * shake, (Math.random() - .5) * 14 * shake); }
  if (hero && heroDraw) {
    const k = Math.min(1, dt * 22);
    heroDraw.x += (hero.x - heroDraw.x) * k; heroDraw.y += (hero.y - heroDraw.y) * k;
    const flick = 0.92 + 0.08 * Math.sin(now / 90) * Math.sin(now / 37);

    for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
      const t = tiles[y]?.[x]; if (t === undefined || t <= 0) continue;
      if (x < camX - 1 || x > camX + VIEW_W + 1) continue;
      const isLit = lit.has(y * GW + x);
      const dist = Math.hypot(x - heroDraw.x, y - heroDraw.y);
      const b = isLit ? Math.max(.18, (1 - dist / 9.5)) * flick : 0.1;
      const wall = t === 5, passage = t === 3;
      if (wall) g.fillStyle = isLit ? `rgb(${92 * b + 12},${70 * b + 10},${52 * b + 10})` : "#14151a";
      else if (passage) g.fillStyle = isLit ? `rgb(${52 * b + 6},${46 * b + 6},${40 * b + 6})` : "#0d0d0f";
      else g.fillStyle = isLit ? `rgb(${70 * b},${58 * b},${44 * b})` : "#0b0c0f";
      g.fillRect(x * T, y * T, T, T);
      if (wall) {                           // レンガ目地。照明色の上に暗い線を重ねるだけなので明るさは保たれる
        g.fillStyle = "rgba(0,0,0,.34)";
        g.fillRect(x * T, y * T + T - 2, T, 2); g.fillRect(x * T, y * T + (T >> 1) - 1, T, 2);
        g.fillRect(x * T + (T >> 1), y * T, 2, T >> 1); g.fillRect(x * T, y * T + (T >> 1), 2, T >> 1);
      } else if (isLit && !passage) { g.fillStyle = `rgba(255,220,170,${.12 * b})`; g.fillRect(x * T + (T >> 1) - 1, y * T + (T >> 1) - 1, 2, 2); }
      if (t === 2) glyph(">", x, y, isLit ? "#8fc0c4" : "#2f4a4c", isLit);
      if (t === 4) glyph("+", x, y, isLit ? "#a9834a" : "#3c3020", false);
    }
    for (const t of traps) glyph("^", t.x, t.y, "#c46b9a", true);
    for (const it of items) glyph(ITEM[it.kind][0], it.x, it.y, ITEM[it.kind][1], true);
    for (const mo of monsters.values()) {
      mo.dx += (mo.x - mo.dx) * k; mo.dy += (mo.y - mo.dy) * k;
      glyph(mo.ch, mo.dx, mo.dy, monsterColor(mo), mo.awake);
      if (mo.hp < mo.max_hp) { g.fillStyle = "#2a0d0a"; g.fillRect(mo.dx * T + 2, mo.dy * T - 3, T - 4, 3); g.fillStyle = "#b8433a"; g.fillRect(mo.dx * T + 2, mo.dy * T - 3, (T - 4) * mo.hp / mo.max_hp, 3); }
    }
    const hx = heroDraw.x * T + T / 2, hy = heroDraw.y * T + T / 2;
    const glow = g.createRadialGradient(hx, hy, 0, hx, hy, T * 5);
    glow.addColorStop(0, "rgba(255,180,80,.20)"); glow.addColorStop(1, "rgba(255,180,80,0)");
    g.fillStyle = glow; g.fillRect(hx - T * 5, hy - T * 5, T * 10, T * 10);
    glyph("@", heroDraw.x, heroDraw.y, flash > 0 ? "#d8563f" : "#f2dc96", true, true);
    flash = Math.max(0, flash - dt * 5);
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i]; f.life -= dt; if (f.life <= 0) { floats.splice(i, 1); continue; }
    f.x += (f.vx || 0) * dt; f.y += (f.vy ?? -1.6) * dt;
    g.globalAlpha = f.life > 0.15 ? 1 : 0.5; g.fillStyle = f.c; g.font = `${T}px ${FONT}`; g.textAlign = "center";
    g.fillText(f.text, f.x * T + T / 2, f.y * T + T / 2);
  }
  g.globalAlpha = 1;
  g.restore();
  if (danger > 0.08) {                     // 瀕死になるほど画面の縁が赤く脈打つ
    const W_ = cv.clientWidth, H_ = T * GH, pulse = 0.75 + 0.25 * Math.sin(now / (260 - danger * 160));
    const v = g.createRadialGradient(W_ / 2, H_ / 2, H_ * .35, W_ / 2, H_ / 2, H_ * .95);
    v.addColorStop(0, "rgba(160,0,0,0)"); v.addColorStop(1, `rgba(190,10,10,${Math.min(.75, danger * .8) * pulse})`);
    g.fillStyle = v; g.fillRect(-T, 0, W_ + T * 2, H_);
  }
  requestAnimationFrame(draw);
}
function glyph(ch, x, y, color, bright, bold) {
  g.font = `${Math.round(T * (bold ? 1.1 : 1))}px ${FONT}`; g.textAlign = "center"; g.textBaseline = "middle";
  if (bright) { g.shadowColor = color; g.shadowBlur = bold ? 14 : 7; }
  g.fillStyle = color; g.fillText(ch, x * T + T / 2, y * T + T / 2);
  g.shadowBlur = 0; g.textBaseline = "alphabetic";
}
resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
